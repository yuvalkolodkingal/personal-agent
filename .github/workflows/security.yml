name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # verify-fuzz.py builds the workspace, which links the desktop stack.
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { toolchain: 1.98.0 }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit,cargo-deny }
      - run: python scripts/security-gate.py
      - run: python scripts/verify-fuzz.py
      - run: cargo audit
      - run: cargo deny check advisories bans licenses sources
      - uses: gitleaks/gitleaks-action@v2

[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/agent",
  "crates/audio",
  "crates/automation",
  "crates/browser",
  "crates/connectors",
  "crates/contracts",
  "crates/context",
  "crates/core",
  "crates/llm",
  "crates/memory",
  "crates/mcp-host",
  "crates/mcp-manager",
  "crates/migration",
  "crates/local-execution",
  "crates/platform",
  "crates/plugins",
  "crates/policy",
  "crates/runtime",
  "crates/storage",
  "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/personal-agent/personal-agent"
authors = ["Personal Agent contributors"]

[workspace.dependencies]
async-trait = "=0.1.92"
base64 = "=0.22.1"
chromiumoxide_cdp = "=0.9.1"
chromiumoxide_types = "=0.9.1"
chrono = { version = "=0.4.45", features = ["serde"] }
command-fds = { version = "=0.3.3", features = ["tokio"] }
cpal = "=0.16.0"
dashmap = "=6.1.0"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.34"
http = "=1.5.0"
keyring = "=4.1.6"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
libc = "=0.2.189"
petgraph = "=0.8.3"
prost = "=0.14.4"
progenitor = "=0.14.0"
progenitor-client = "=0.14.0"
regress = "=0.11.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "client-side-sse", "transport-child-process", "transport-streamable-http-client"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "backup", "chrono", "serde_json", "uuid"] }
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sse-stream = "=0.2.5"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = "=2.4.3"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = "=0.7.19"
toml = "=1.1.4"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.25.0", features = ["serde", "v4", "v7"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Development builds emit line tables only. The rebuild-test loop is dominated
# by linking full debug info for the desktop binary, and panics and backtraces
# still resolve to file and line. Optimization settings are untouched, so the
# deterministic replay benchmarks measure identical codegen.
[profile.dev]
debug = "line-tables-only"
